name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q cozyfurniture-fabric-26.2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
        working-directory: cozyfurniture
      - uses: actions/upload-artifact@v4
        with:
          name: cozyfurniture-jar
          path: cozyfurniture/build/libs/cozyfurniture-1.0.0.jar
